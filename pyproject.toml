[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-oculta-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "faster-whisper>=1.1.0", "imageio-ffmpeg>=0.6.0"]

[project.optional-dependencies]
voice = ["piper-tts>=1.8.0"]
youtube = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
test = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
